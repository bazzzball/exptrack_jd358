[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bazzzball-exptrack_jd358"
version = "0.1.0"
description = "用一组明示的正则规则扫描输入，报告实验管理与追踪工程师·知识库的时效性维护相关的命中行与片段"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "bazzzball" }]
keywords = ["cli", "analysis", "observability", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://bazzzball.github.io"
Repository = "https://github.com/bazzzball/exptrack_jd358"
Issues = "https://github.com/bazzzball/exptrack_jd358/issues"

[project.scripts]
exptrack_jd358 = "exptrack_jd358:main"

[tool.setuptools]
py-modules = ["exptrack_jd358"]
